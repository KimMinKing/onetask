services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      # Containers reach PostgreSQL by its Compose service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradediary}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-onetask}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    volumes:
      - ./backend/test_output:/app/test_output
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://152.69.206.56:8001}
    restart: unless-stopped
    ports:
      - "3000:3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradediary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradediary}
      POSTGRES_DB: ${POSTGRES_DB:-onetask}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradediary} -d ${POSTGRES_DB:-onetask}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
